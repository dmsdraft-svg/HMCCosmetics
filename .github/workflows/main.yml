name: Build HMCCosmetics

on:
  push:
    branches: [ "main", "master", "remapped" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all modules
        run: ./gradlew clean build

      - name: Build remapped JAR
        run: ./gradlew remapJar

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HMCCosmetics-Full-Build
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          retention-days: 7
